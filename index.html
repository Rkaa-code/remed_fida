<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Katalog Mebel Nusantara</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-amber-50">

    <!-- Header -->
    <header class="bg-amber-900 text-white p-5 shadow-lg">
        <h1 class="text-xl md:text-3xl font-bold text-center md:text-left">
            E-Katalog Mebel Nusantara
        </h1>
    </header>

    <!-- Layout -->
    <div class="flex flex-col md:flex-row min-h-screen">

        <!-- Sidebar -->
        <aside class="w-full md:w-64 bg-amber-800 text-white p-4">

            <h2 class="font-bold text-xl mb-4 text-center md:text-left">
                Kategori
            </h2>

            <div class="grid grid-cols-2 gap-2 md:flex md:flex-col">

                <button
                    class="kategori-btn w-full bg-amber-900 text-white p-2 rounded transition-all duration-300 hover:bg-amber-950"
                    data-kategori="Semua">
                    Semua
                </button>

                <button
                    class="kategori-btn w-full bg-amber-600 p-2 rounded transition-all duration-300 hover:bg-amber-700"
                    data-kategori="Ruang Tamu">
                    Ruang Tamu
                </button>

                <button
                    class="kategori-btn w-full bg-amber-600 p-2 rounded transition-all duration-300 hover:bg-amber-700"
                    data-kategori="Kamar Tidur">
                    Kamar Tidur
                </button>

                <button
                    class="kategori-btn w-full bg-amber-600 p-2 rounded transition-all duration-300 hover:bg-amber-700"
                    data-kategori="Dapur & Ruang Makan">
                    Dapur & Ruang Makan
                </button>

                <button
                    class="kategori-btn w-full bg-amber-600 p-2 rounded transition-all duration-300 hover:bg-amber-700"
                    data-kategori="Ruang Kerja">
                    Ruang Kerja
                </button>

                <button
                    class="kategori-btn w-full bg-amber-600 p-2 rounded transition-all duration-300 hover:bg-amber-700"
                    data-kategori="Outdoor">
                    Area Outdoor/Taman
                </button>

            </div>

        </aside>

        <!-- Konten -->
        <main class="flex-1 p-4 md:p-6">

            <!-- Search -->
            <input
                type="text"
                id="search"
                placeholder="Cari nama furnitur atau bahan kayu..."
                class="w-full border border-amber-300 p-3 rounded-lg mb-6 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-amber-600"
            >

            <!-- Grid Produk -->
            <div
                id="produk-container"
                class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
            </div>

        </main>

    </div>

    <script src="mebel-data.js"></script>
    <script src="script.js"></script>

</body>
</html>
